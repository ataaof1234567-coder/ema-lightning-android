
plugins {
    id 'com.android.application'
    id 'com.chaquopy.python'
}

android {
    namespace 'com.canberk.ema'
    compileSdk 34

    defaultConfig {
        applicationId "com.canberk.ema"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0-lightning"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        python {
            // Chaquopy python version
            version "3.10"
            pip {
                // ema-lightning ve bağımlılıkları - CPU için
                install "numpy"
                install "torch --index-url https://download.pytorch.org/whl/cpu"
                install "torchaudio --index-url https://download.pytorch.org/whl/cpu"
                install "ema-lightning"
                install "normalizer-tr"
                install "soundfile"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        resources {
            excludes += "**/libonnxruntime*"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

chaquopy {
    // Model dosyaları için extract
    extractPackages "torch", "torchaudio"
}
